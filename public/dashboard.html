<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>StudyLock — لوحة المسؤول</title>
  <link rel="stylesheet" href="/public/css/dashboard.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-name">StudyLock</span>
        <span class="brand-sub">لوحة المسؤول</span>
      </div>
      <button id="logoutBtn" class="btn-logout" type="button">خروج</button>
    </header>

    <main class="main">
      <section class="stats" aria-label="إحصائيات">
        <div class="stat-card">
          <div class="stat-num" id="statUsers">–</div>
          <div class="stat-label">Users</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statActive">–</div>
          <div class="stat-label">Active Sessions</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statPending">–</div>
          <div class="stat-label">Pending Requests</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statUnlocked">–</div>
          <div class="stat-label">Unlocked</div>
        </div>
      </section>

      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="users" type="button" role="tab">
          المستخدمون
        </button>
        <button class="tab" data-tab="requests" type="button" role="tab">
          طلبات الفتح
          <span id="reqBadge" class="badge hidden">0</span>
        </button>
      </div>

      <section id="panelUsers" class="panel">
        <div class="panel-head">
          <h2 class="panel-title">المستخدمون</h2>
        </div>

        <div id="usersList" class="list"></div>

        <form id="createUserForm" class="create-form">
          <h3 class="create-title">تسجيل مستخدم جديد</h3>
          <input id="newName" class="input" placeholder="الاسم" required />
          <input id="newUsername" class="input" placeholder="اسم المستخدم" required />
          <button class="btn btn-primary" type="submit">إضافة</button>
        </form>
      </section>

      <section id="panelRequests" class="panel hidden">
        <div class="panel-head">
          <h2 class="panel-title">طلبات فتح الوضع</h2>
        </div>
        <div id="requestsList" class="list"></div>
      </section>

      <div id="errorBox" class="error hidden" role="alert"></div>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="/public/js/dashboard.js"></script>
</body>
</html>
