<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>StudyLock — دخول المسؤول</title>
  <link rel="stylesheet" href="/public/css/login.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="brand">
      <h1 class="brand-name">StudyLock</h1>
      <p class="brand-tag">دخول لوحة المسؤول</p>
    </div>

    <form id="loginForm" class="card" autocomplete="on" novalidate>
      <label class="field">
        <span class="field-label">اسم المستخدم</span>
        <input id="username" class="input" type="text" autocomplete="username"
               placeholder="admin" required />
      </label>

      <label class="field">
        <span class="field-label">كلمة المرور</span>
        <input id="password" class="input" type="password" autocomplete="current-password"
               placeholder="••••••••" required />
      </label>

      <button id="loginBtn" class="btn btn-primary" type="submit">تسجيل الدخول</button>

      <div id="errorBox" class="error hidden" role="alert"></div>
    </form>
  </div>

  <script src="/public/js/login.js"></script>
</body>
</html>
